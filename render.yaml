services:
  - type: web
    name: fbdump
    runtime: python
    plan: free
    region: oregon
    buildCommand: |
      pip install --no-cache-dir -r requirements.txt && \
      (which google-chrome || (apt-get update -qq && apt-get install -y -qq google-chrome-stable || \
       (apt-get update -qq && apt-get install -y -qq chromium chromium-browser))) && \
      (google-chrome --version || chromium --version)
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: FBDUMP_SETTLE
        value: "22"
